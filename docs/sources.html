<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--mute:#6b6b66;--card:#fff;--line:#dcdcd6;--nodata:#ecebe6;

:root[data-theme="dark"]{--bg:#161615;--fg:#ececea;--mute:#9a9a94;--card:#1f1f1d;--line:#3a3a36;
--nodata:#262624;--left:#e5685a;--center:#a0a0a0;--right:#5aa0e0;--ramp0:#1f2b36;--ramp1:#7cc0f0;}
*{box-sizing:border-box}
.nav{border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.nav .in{max-width:980px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.nav .brand{font-weight:700;margin-right:auto;padding:12px 0;color:var(--fg);text-decoration:none}
.nav a.tab{color:var(--mute);text-decoration:none;padding:12px 12px;border-bottom:2px solid transparent;margin-bottom:-1px}

body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px;max-width:62ch}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px}
select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button.on{border-color:var(--fg)}
.slider{flex:1;min-width:220px;display:flex;align-items:center;gap:10px}
.slider input{flex:1}
.q{font-variant-numeric:tabular-nums;min-width:6.5em}
.grid{display:grid;grid-template-columns:minmax(320px,1.25fr) 1fr;gap:20px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--mute);font-weight:600}

.prov{stroke:var(--card);stroke-width:.8;stroke-linejoin:round;cursor:pointer}
.prov.nodata{cursor:default}.prov.sel{stroke:var(--fg);stroke-width:2.2}
.plabel{font-size:11px;font-weight:600;text-anchor:middle;pointer-events:none}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.cardhead h2{margin:0}
#natbtn{font-size:13px;padding:4px 10px;border-radius:999px}
#natbtn.on{border-color:var(--fg);font-weight:600}
.ramp{height:8px;border-radius:4px;background:linear-gradient(to right,var(--ramp0),var(--ramp1));border:1px solid var(--line)}
.rampl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:3px}
.seg{display:inline-flex;gap:10px}
.leg2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute)}.leg2 i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.pagelink{font-size:14px}.pagelink a{color:var(--fg);font-weight:600}
.termpick{position:relative}
#tpanel{position:absolute;z-index:10;top:calc(100% + 6px);left:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:250px;max-height:340px;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}

.adder{display:flex;gap:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;min-height:6px}
.chip{display:inline-flex;border:1px solid var(--fg);border-radius:999px;background:var(--card);overflow:hidden}

.qsec{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 12px}

label();

<script>
(function(){var d=document.querySelector(".nav .dd");if(!d)return;var b=d.querySelector(".ddbtn");
function set(o){d.classList.toggle("open",o);b.setAttribute("aria-expanded",o)}
b.addEventListener("click",function(e){e.stopPropagation();set(!d.classList.contains("open"))});
document.addEventListener("click",function(e){if(!d.contains(e.target))set(false)});

<script>
(function(){
const D=window.DATA,R=window.RECENT,$=id=>document.getElementById(id);
if(!R||!R.rows){$("feed").innerHTML='<li class="hl-empty">The recent-headlines file is missing. Run export_recent.py and push docs/recent.js.</li>';return}
const PAGE=100;
const REG={YT:"TER",NT:"TER",NU:"TER"};
const NAMES={NAT:"National outlets",BC:"British Columbia",AB:"Alberta",SK:"Saskatchewan",MB:"Manitoba",ON:"Ontario",QC:"Quebec",NB:"New Brunswick",NS:"Nova Scotia",PE:"Prince Edward Island",NL:"Newfoundland and Labrador",TER:"Territories"};
const PORDER=["BC","AB","SK","MB","ON","QC","NB","NS","PE","NL","TER","NAT"];
const GROUPS=[["left","Left","var(--left)"],["center","Centre","var(--center)"],["right","Right","var(--right)"]];
const LEAN={left:"Left",lean_left:"Lean left",center:"Centre",lean_right:"Lean right",right:"Right"};
const prov=o=>REG[D.outlets[o].province]||D.outlets[o].province;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const termRe=t=>new RegExp("(?<![\\p{L}\\p{N}])"+reEsc(t)+"(?![\\p{L}\\p{N}])","iu");
const gcol=g=>(GROUPS.find(x=>x[0]===g)||[0,0,"var(--center)"])[2];

const mapRows=a=>a.filter(r=>D.outlets[r[0]]).map(r=>({o:r[0],d:r[1],h:r[2],u:r[3],en:r[4]||"",g:D.outlets[r[0]].group,p:prov(r[0])}));
const outs=Object.keys(D.outlets).sort((a,b)=>D.outlets[a].name.localeCompare(D.outlets[b].name));
const provs=PORDER.filter(p=>outs.some(o=>prov(o)===p));
const YEARS=(R.years||[]).map(String);
const cacheY={latest:mapRows(R.rows)};
let rows=cacheY.latest;

const st={g:new Set(),p:new Set(),o:new Set(),t:[],q:"",shown:PAGE,y:"latest"};
const qs=new URLSearchParams(location.search);
(qs.get("g")||"").split(",").forEach(x=>GROUPS.some(g=>g[0]===x)&&st.g.add(x));
(qs.get("p")||"").split(",").forEach(x=>provs.includes(x)&&st.p.add(x));
(qs.get("o")||"").split(",").forEach(x=>outs.includes(x)&&st.o.add(x));
if(YEARS.includes(qs.get("y")))st.y=qs.get("y");
st.t=(qs.get("t")||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);

D.terms.slice().sort().forEach(t=>{const o=document.createElement("option");o.value=t;$("tlist").appendChild(o)});

let termRes=[];
function pass(r,skip){
  if(skip!=="g"&&st.g.size&&!st.g.has(r.g))return false;
  if(skip!=="p"&&st.p.size&&!st.p.has(r.p))return false;
  if(skip!=="o"&&st.o.size&&!st.o.has(r.o))return false;
  if(skip!=="t"&&termRes.length){const s=r.h+" "+r.en;if(!termRes.some(re=>re.test(s)))return false}
  return true;
}
function tally(skip,key){const c={};for(const r of rows)if(pass(r,skip))c[r[key]]=(c[r[key]]||0)+1;return c}
function opt(kind,val,label,n,dotcol,checked){
  const l=document.createElement("label");l.className="opt"+(n?"":" zero");
  const i=document.createElement("input");i.type="checkbox";i.checked=checked;
  i.addEventListener("change",()=>{const s=st[kind];i.checked?s.add(val):s.delete(val);st.shown=PAGE;render()});
  l.appendChild(i);
  if(dotcol){const d=document.createElement("span");d.className="dot";d.style.background=dotcol;l.appendChild(d)}
  const t=document.createElement("span");t.textContent=label;l.appendChild(t);
  const c=document.createElement("span");c.className="n";c.textContent=n.toLocaleString();l.appendChild(c);
  return l;
}
function yopt(val,label){
  const l=document.createElement("label");l.className="opt year";
  const i=document.createElement("input");i.type="radio";i.name="y";i.checked=st.y===val;
  i.addEventListener("change",()=>{st.y=val;st.shown=PAGE;setYear()});
  l.appendChild(i);const t=document.createElement("span");t.textContent=label;l.appendChild(t);return l;
}
function drawFilters(){
  $("fy").replaceChildren(yopt("latest","Latest"),...YEARS.map(y=>yopt(y,y)));
  const cg=tally("g","g"),cp=tally("p","p"),co=tally("o","o");
  $("fl").replaceChildren(...GROUPS.map(([v,l,c])=>opt("g",v,l,cg[v]||0,c,st.g.has(v))));
  $("fp").replaceChildren(...provs.map(p=>opt("p",p,NAMES[p],cp[p]||0,null,st.p.has(p))));
  const q=st.q.trim().toLowerCase();
  $("fo").replaceChildren(...outs.filter(o=>st.o.has(o)||!q||D.outlets[o].name.toLowerCase().includes(q))
    .map(o=>opt("o",o,D.outlets[o].name,co[o]||0,gcol(D.outlets[o].group),st.o.has(o))));
  $("tchips").replaceChildren(...st.t.map(t=>{
    const c=document.createElement("span");c.className="tchip";
    const n=document.createElement("span");n.textContent=t;
    const x=document.createElement("button");x.type="button";x.textContent="×";x.setAttribute("aria-label","Remove "+t);
    x.addEventListener("click",()=>{st.t=st.t.filter(y=>y!==t);st.shown=PAGE;render()});
    c.append(n,x);return c}));
}
function fmtDay(d){return new Intl.DateTimeFormat("en-CA",{dateStyle:"long",timeZone:"UTC"}).format(new Date(d+"T00:00:00Z"))}
function hi(text){
  if(!termRes.length)return esc(text);
  let out="",rest=text;
  const re=new RegExp(st.t.map(t=>"(?<![\\p{L}\\p{N}])"+reEsc(t)+"(?![\\p{L}\\p{N}])").join("|"),"giu");
  let last=0,m;
  while((m=re.exec(text))){if(!m[0])break;out+=esc(text.slice(last,m.index))+"<mark>"+esc(m[0])+"</mark>";last=m.index+m[0].length}
  return out+esc(text.slice(last));
}
function drawFeed(){
  const list=rows.filter(r=>pass(r));
  $("count").textContent=list.length.toLocaleString()+(list.length===1?" headline":" headlines");
  const active=st.g.size||st.p.size||st.o.size||st.t.length;
  $("reset").hidden=!active;
  $("fbtn").textContent="Filters"+(active?" ("+(st.g.size+st.p.size+st.o.size+st.t.length)+")":"");
  const feed=$("feed");feed.innerHTML="";
  if(!list.length){feed.innerHTML='<li class="hl-empty">No headlines match these filters. Try removing one.</li>';$("more").hidden=true;return}
  let day="";
  const frag=document.createDocumentFragment();
  list.slice(0,st.shown).forEach(r=>{
    if(r.d!==day){day=r.d;const h=document.createElement("li");h.className="hl-day";h.setAttribute("role","presentation");h.textContent=fmtDay(day);frag.appendChild(h)}
    const o=D.outlets[r.o],li=document.createElement("li");li.className="hl-item";
    li.innerHTML='<span class="dot" style="background:'+gcol(r.g)+'" title="'+esc(LEAN[o.leaning]||"")+'"></span><div><a class="t" target="_blank" rel="noopener noreferrer" href="https://'+esc(r.u)+'">'+hi(r.h)+'</a>'+
      (r.en?'<div class="hl-en">'+hi(r.en)+'</div>':'')+
      '<div class="hl-meta">'+esc(o.name)+' · '+esc(NAMES[r.p]||r.p)+' · '+esc(LEAN[o.leaning]||"Unrated")+(r.en?'<span class="hl-fr" title="Headline is in French; English is machine-translated">FR</span>':'')+'</div></div>';
    frag.appendChild(li);
  });
  feed.appendChild(frag);
  const left=list.length-st.shown;
  $("more").hidden=left<=0;$("more").textContent="Show "+Math.min(PAGE,left)+" more ("+left.toLocaleString()+" left)";
}
function sync(){
  const p=new URLSearchParams();
  if(st.g.size)p.set("g",[...st.g].join(","));if(st.p.size)p.set("p",[...st.p].join(","));
  if(st.o.size)p.set("o",[...st.o].join(","));if(st.t.length)p.set("t",st.t.join(","));if(st.y!=="latest")p.set("y",st.y);
  try{history.replaceState(null,"",p.toString()?"?"+p:location.pathname)}catch(e){}
}
function render(){termRes=st.t.map(termRe);drawFilters();drawFeed();sync();drawNote()}
let ytok=0;
async function setYear(){
  const mine=++ytok,y=st.y;
  if(!cacheY[y]){
    $("count").textContent="Loading "+y+"…";
    try{const r=await fetch("headlines/"+y+".json");if(!r.ok)throw 0;cacheY[y]=mapRows((await r.json()).rows)}
    catch(e){if(mine!==ytok)return;$("feed").innerHTML='<li class="hl-empty">Could not load the headlines for '+y+'. Run export_recent.py and push docs/headlines/.</li>';$("more").hidden=true;return}
  }
  if(mine!==ytok)return;
  rows=cacheY[y];render();
}
function drawNote(){
  const newest=rows.reduce((m,r)=>r.d>m?r.d:m,"");
  const tail=" Syndicated copies and dead links are left out. French headlines are shown in the original with a machine translation. Within a filter, selections are combined with “or”; between filters, with “and”.";
  $("note").textContent=st.y==="latest"
    ? "Showing the most recent headlines for each outlet, from the same sections used for the term counts"+(newest?" (newest: "+fmtDay(newest)+")":"")+"."+tail
    : "Showing a random sample of up to "+(R.perYear||40)+" headlines per outlet from "+st.y+", from the same sections used for the term counts, so it is a cross-section of the year and not every headline."+tail;
}
function addTerm(){
  const v=$("tin").value.trim().toLowerCase();$("tin").value="";
  if(v&&!st.t.includes(v)){st.t.push(v);st.shown=PAGE;render()}
}
$("tadd").addEventListener("click",addTerm);
$("tin").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addTerm()}});
$("osearch").addEventListener("input",e=>{st.q=e.target.value;drawFilters()});
$("more").addEventListener("click",()=>{st.shown+=PAGE;drawFeed()});
$("reset").addEventListener("click",()=>{st.g.clear();st.p.clear();st.o.clear();st.t=[];st.shown=PAGE;render()});
$("fbtn").addEventListener("click",()=>$("side").classList.toggle("open"));
$("sub").textContent="Headlines behind the numbers, newest first, from "+outs.length+" outlets. Each one links to the publisher's own page.";
st.y==="latest"?render():setYear();
})();
</script>
</body>
