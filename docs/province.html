<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Press by Province</title>
<script>(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--mute:#6b6b66;--card:#fff;--line:#dcdcd6;--nodata:#ecebe6;
--left:#c0392b;--center:#7a7a7a;--right:#2a6fb0;}
:root[data-theme="dark"]{--bg:#161615;--fg:#ececea;--mute:#9a9a94;--card:#1f1f1d;--line:#3a3a36;
--nodata:#262624;--left:#e5685a;--center:#a0a0a0;--right:#5aa0e0;}
*{box-sizing:border-box}
.nav{border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.nav .in{max-width:980px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.nav .brand{font-weight:700;margin-right:auto;padding:12px 0;color:var(--fg);text-decoration:none}
.nav a.tab{color:var(--mute);text-decoration:none;padding:12px 12px;border-bottom:2px solid transparent;margin-bottom:-1px}
.nav a.tab:hover{color:var(--fg)}
.nav a.tab[aria-current=page]{color:var(--fg);font-weight:600;border-bottom-color:var(--fg)}

body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
a{color:var(--fg)}
.back{display:inline-block;margin-bottom:10px;font-size:14px;color:var(--mute);text-decoration:none}
.back:hover{color:var(--fg)}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;max-width:70ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pills a{font-size:13px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);text-decoration:none}
.pills a.cur{border-color:var(--fg);font-weight:600}
.pills a.dim{color:var(--mute);background:var(--nodata)}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px}
select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.termpick{position:relative}
#tpanel{position:absolute;z-index:10;top:calc(100% + 6px);left:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:250px;max-height:340px;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tpanel[hidden]{display:none}
#tpanel label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:14px}
#tpanel label:hover{background:var(--nodata)}
#tpanel .clear{margin-top:6px;font-size:13px;width:100%}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;min-height:8px}
.chip{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden}
.chip button{border:0;border-radius:0;background:none;padding:3px 10px;font-size:13px}
.chip button.x{padding:3px 9px 3px 2px;color:var(--mute)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.charts.n0 .card,.charts.n1 .card,.charts .pagelink{grid-column:1/-1}
@media(max-width:760px){.charts{grid-template-columns:1fr}}

.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--mute);font-weight:600}
svg text{fill:var(--fg);font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.sw{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mute);font-weight:600;padding:0 6px 6px 0}
td{padding:7px 6px 7px 0;border-top:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
.small{display:block;color:var(--mute);font-size:12px}
.empty{color:var(--mute);margin:0;max-width:60ch}
.note{color:var(--mute);font-size:13px;margin-top:14px;max-width:80ch}
#tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;
padding:6px 9px;font-size:13px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:5}
.nav button{font:inherit;font-size:13px;padding:5px 10px;margin-left:6px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;cursor:pointer}
.nav button.tog[aria-pressed=false]{color:var(--mute)}
:root{--mapbg:#f1f0eb;--mapfill:#ffffff;--mapline:#111111;--maplabel:#1d1d1b}
:root[data-theme=dark]{--mapbg:#05090d;--mapfill:#0f141b;--mapline:#e5685a;--maplabel:#d5dee6}
:root{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}

.nav .dd{position:relative}
.nav .ddbtn{margin:0 0 -1px 0;padding:12px 12px;font-size:inherit;color:var(--mute);background:none;border:0;border-bottom:2px solid transparent;border-radius:0;cursor:pointer}
.nav .ddbtn:hover,.nav .dd.open .ddbtn{color:var(--fg)}
.nav .ddbtn[aria-current=page]{color:var(--fg);font-weight:600;border-bottom-color:var(--fg)}
.nav .ddmenu{display:none;position:absolute;top:100%;left:0;min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:6px;z-index:30}
.nav .dd.open .ddmenu,.nav .dd:hover .ddmenu{display:block}
.nav .ddmenu a{display:block;padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:14px}
.nav .ddmenu a:hover{background:var(--nodata)}
.nav .ddmenu a[aria-current=page]{font-weight:600}
</style>
</head>
<body>
<nav class="nav"><div class="in"><a class="brand" href="index.html">Common Canadian Headliners</a><a class="tab" href="index.html">Map</a><a class="tab" href="province.html" aria-current="page">Provinces</a><a class="tab" href="about.html">About</a><a class="tab" href="data.html">Data Downloads</a><a class="tab" href="sources.html">Sources</a><button id="themebtn" type="button" aria-label="Switch between light and dark mode">Dark mode</button></div></nav>
<main>
<a class="back" id="back" href="index.html">← All of Canada</a>
<h1 id="ptitle">Local press</h1>
<p class="sub" id="psub"></p>
<div class="pills" id="pnav"></div>
<div class="controls"><div class="termpick"><button id="tbtn" type="button">Choose terms ▾</button><div id="tpanel" hidden></div></div></div>
<div class="chips" id="chips"></div>
<div class="card tablecard"><h2>Local outlets</h2><div id="table"></div></div>
<div class="charts" id="charts"></div>
</main>
<div id="tip"></div>
<script src="data.js"></script>
<script>
const D = window.DATA, Q = D.quarters, NS = "http://www.w3.org/2000/svg";
Object.values(D.rates).forEach(by=>Object.keys(by).forEach(o=>{by[o]=by[o].map(v=>v===null?null:v*100)}));   // site shows rates per 100,000 headlines

const REG = {YT:"TER",NT:"TER",NU:"TER"};   // the three territories are one region
const NAMES = {BC:"British Columbia",AB:"Alberta",SK:"Saskatchewan",MB:"Manitoba",ON:"Ontario",QC:"Quebec",NB:"New Brunswick",NL:"Newfoundland and Labrador",PE:"Prince Edward Island",NS:"Nova Scotia",TER:"Northern Territories"};
const ORDER = ["BC","AB","SK","MB","ON","QC","NB","NS","PE","NL","TER"];
const LEANS = {left:"Left",lean_left:"Lean Left",center:"Center",lean_right:"Lean Right",right:"Right"};
const GROUPCOL = {left:"var(--left)",center:"var(--center)",right:"var(--right)"};
const params = new URLSearchParams(location.search);
let prov = ORDER.includes(params.get("p")) ? params.get("p") : "AB";
let terms = (params.get("terms")||params.get("term")||"").split(",").filter(t=>D.terms.includes(t));

const $ = id => document.getElementById(id);
function el(tag, attrs, parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function mean(a){a=a.filter(v=>v!==null&&v!==undefined);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function outletsIn(p){return Object.keys(D.outlets).filter(o=>(REG[D.outlets[o].province]||D.outlets[o].province)===p)}
const ACR={dei:"DEI",ndp:"NDP",uk:"UK",usa:"USA",bc:"BC",pm:"PM",mp:"MP",mps:"MPs",rcmp:"RCMP",covid:"COVID","covid-19":"COVID-19",ucp:"UCP",cbc:"CBC"};
function cap(t){return t.split(" ").map(w=>ACR[w]||w.split("-").map(x=>ACR[x]||x.charAt(0).toUpperCase()+x.slice(1)).join("-")).join(" ")}
function fmt(v){return v===null?"no data":v.toFixed(v<10?2:v<100?1:0)}
function tip(e,html){const t=$("tip");t.innerHTML=html;t.style.display="block";t.style.left=Math.min(e.clientX+14,innerWidth-200)+"px";t.style.top=(e.clientY+14)+"px"}
function qs(p){return "?p="+p+(terms.length?"&terms="+encodeURIComponent(terms.join(",")):"")}

function drawHeader(){
  const outs=outletsIn(prov);
  document.title=NAMES[prov]+" · Local Press";
  $("ptitle").textContent=NAMES[prov]+": local press";
  $("back").href="index.html";
  $("psub").textContent=outs.length
    ?`${outs.length} local outlet${outs.length===1?"":"s"} in the dataset. Pick one or more terms to compare the outlets with each other and with the country as a whole.`
    :"";
  $("pnav").innerHTML=ORDER.map(p=>`<a href="province.html${qs(p)}" class="${p===prov?"cur":""}${outletsIn(p).length?"":" dim"}">${NAMES[p]}</a>`).join("");
}
function drawTable(){
  const outs=outletsIn(prov),box=$("table");
  if(!outs.length){
    box.innerHTML=`<p class="empty">No local outlets from ${NAMES[prov]} are in the dataset yet.${prov==="TER"?" The territories are mostly covered by national outlets, such as CBC North, which appear in the Canada-wide view. Territorial headlines may be added later.":""}</p>`;
    return;
  }
  const any=D.rates[D.terms[0]];
  box.innerHTML="<table><tr><th>Outlet</th><th>Leaning</th><th class=num>"+(terms.length?"Avg per 100,000":"")+"</th></tr>"+outs.map(o=>{
    const m=D.outlets[o],r=any[o],idx=r.map((v,i)=>v===null?-1:i).filter(i=>i>=0);
    const cov=idx.length?`${Q[idx[0]]} to ${Q[idx[idx.length-1]]} · ${idx.length} quarter${idx.length===1?"":"s"}`:"no usable quarters";
    const avg=terms.map(t=>`${terms.length>1?`<span class="small">${cap(t)}</span>`:""}${fmt(mean(D.rates[t][o]))}`).join("<br>");
    return `<tr><td><i class="sw" style="background:${GROUPCOL[m.group]}"></i><b>${m.name}</b><span class="small">${cov}</span></td><td>${LEANS[m.leaning]||LEANS[m.group]}<span class="small">${m.owner}</span></td><td class="num">${avg}</td></tr>`}).join("")+"</table>";
}
function drawChart(svg,lg,ttl,t){
  const outs=outletsIn(prov);
  ttl.textContent=`Instances of “${cap(t)}” in ${prov==="NAT"?"Canada":NAMES[prov]} (per 100,000 headlines)`;
  if(!outs.length){const x=el("text",{x:280,y:150,"text-anchor":"middle","font-size":15},svg);x.textContent="No local outlets here yet.";x.style.fill="var(--mute)";return}
  const lines=outs.map(o=>({name:D.outlets[o].name,col:GROUPCOL[D.outlets[o].group],vals:D.rates[t][o]}));
  const natl=Q.map((_,i)=>mean(Object.keys(D.outlets).map(o=>D.rates[t][o][i])));
  const L=44,R=10,T=10,B=26,W=560,H=300,pw=W-L-R,ph=H-T-B;
  let ymax=0;lines.concat([{vals:natl}]).forEach(l=>l.vals.forEach(v=>{if(v!==null)ymax=Math.max(ymax,v)}));
  ymax=ymax||1;const nice=Math.pow(10,Math.floor(Math.log10(ymax))),step=[1,2,5,10].map(m=>m*nice).find(s=>ymax/s<=5)||nice*10,top=Math.ceil(ymax/step)*step;
  const X=i=>L+pw*i/(Q.length-1),Y=v=>T+ph*(1-v/top);
  for(let v=0;v<=top+1e-9;v+=step){el("line",{x1:L,x2:W-R,y1:Y(v),y2:Y(v),stroke:"var(--line)"},svg);el("text",{x:L-6,y:Y(v)+4,"text-anchor":"end","font-size":11},svg).textContent=+v.toFixed(2)}
  Q.forEach((q,i)=>{if(q.endsWith("Q1"))el("text",{x:X(i),y:H-8,"text-anchor":"middle","font-size":11},svg).textContent=q.slice(0,4)});
  const path=(arr)=>{let d="",pen=false;arr.forEach((v,i)=>{if(v===null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);pen=true});return d};
  el("path",{d:path(natl),fill:"none",stroke:"var(--fg)","stroke-width":1.8,"stroke-dasharray":"5 4",opacity:.7},svg);
  lines.forEach(l=>{
    el("path",{d:path(l.vals),fill:"none",stroke:l.col,"stroke-width":2.2,opacity:.9},svg);
    lg.insertAdjacentHTML("beforeend",`<span><i class="sw" style="background:${l.col}"></i>${l.name}</span>`);
  });
  lg.insertAdjacentHTML("beforeend",`<span><i class="sw" style="background:none;border-top:2px dashed var(--fg);height:0"></i>All outlets, Canada</span>`);
  const hov=el("rect",{x:L,y:T,width:pw,height:ph,fill:"transparent"},svg);
  const guide=el("line",{y1:T,y2:T+ph,stroke:"var(--fg)","stroke-width":1.3,"stroke-dasharray":"2 3",opacity:.8,"pointer-events":"none",visibility:"hidden"},svg);
  hov.addEventListener("mousemove",e=>{
    const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,i=Math.max(0,Math.min(Q.length-1,Math.round((px-L)/pw*(Q.length-1))));
    guide.setAttribute("x1",X(i));guide.setAttribute("x2",X(i));guide.setAttribute("visibility","visible");
    tip(e,`<b>${Q[i]}</b><br>`+lines.map(l=>`${l.name}: ${fmt(l.vals[i])}`).join("<br>")+`<br>All outlets, Canada: ${fmt(natl[i])}`)});
  hov.addEventListener("mouseleave",()=>{$("tip").style.display="none";guide.setAttribute("visibility","hidden")});
}
function drawCharts(){
  const box=$("charts");box.innerHTML="";box.className="charts n"+Math.min(terms.length,2);
  if(!terms.length)return;
  terms.forEach(t=>{
    const card=document.createElement("div");card.className="card";
    card.innerHTML='<h2></h2><svg width="100%" viewBox="0 0 560 300"></svg><div class="legend"></div>';
    box.appendChild(card);
    drawChart(card.querySelector("svg"),card.querySelector(".legend"),card.querySelector("h2"),t);
  });
}
function drawChips(){
  const box=$("chips");box.innerHTML="";
  terms.forEach(t=>{
    const c=document.createElement("span");c.className="chip";
    c.innerHTML=`<button class="nm" type="button" disabled style="color:var(--fg)">${cap(t)}</button><button class="x" type="button" title="Remove" aria-label="Remove ${cap(t)}">×</button>`;
    c.querySelector(".x").addEventListener("click",()=>toggleTerm(t,false));
    box.appendChild(c);
  });
  $("tbtn").textContent=terms.length?`Terms (${terms.length}) ▾`:"Choose terms ▾";
}
function toggleTerm(t,on){
  terms=on?terms.concat(t):terms.filter(x=>x!==t);
  document.querySelectorAll("#tpanel input[type=checkbox]").forEach(cb=>{cb.checked=terms.includes(cb.value)});
  history.replaceState(null,"",qs(prov));
  draw();
}
function draw(){drawHeader();drawTable();drawChips();drawCharts()}
(function buildPicker(){
  const panel=$("tpanel");
  D.terms.slice().sort((a,b)=>a.localeCompare(b)).forEach(t=>{
    const lab=document.createElement("label");
    lab.innerHTML=`<input type="checkbox" value="${t}"${terms.includes(t)?" checked":""}> ${cap(t)}`;
    lab.querySelector("input").addEventListener("change",e=>toggleTerm(t,e.target.checked));
    panel.appendChild(lab);
  });
  const clr=document.createElement("button");clr.type="button";clr.className="clear";clr.textContent="Clear all";
  clr.addEventListener("click",()=>{terms=[];document.querySelectorAll("#tpanel input").forEach(cb=>cb.checked=false);history.replaceState(null,"",qs(prov));draw()});
  panel.appendChild(clr);
  $("tbtn").addEventListener("click",e=>{e.stopPropagation();panel.hidden=!panel.hidden});
  document.addEventListener("click",e=>{if(!panel.contains(e.target)&&e.target!==$("tbtn"))panel.hidden=true});
})();
draw();
</script>
<script>
(function(){var b=document.getElementById("themebtn");if(!b)return;
function label(){b.textContent=document.documentElement.dataset.theme==="dark"?"☀ Light mode":"☾ Dark mode"}
label();
b.addEventListener("click",function(){var t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}label();if(window.onTheme)window.onTheme()})})();
</script>
<script>
(function(){var d=document.querySelector(".nav .dd");if(!d)return;var b=d.querySelector(".ddbtn");
function set(o){d.classList.toggle("open",o);b.setAttribute("aria-expanded",o)}
b.addEventListener("click",function(e){e.stopPropagation();set(!d.classList.contains("open"))});
document.addEventListener("click",function(e){if(!d.contains(e.target))set(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")set(false)})})();
</script>
</body>
</html>
